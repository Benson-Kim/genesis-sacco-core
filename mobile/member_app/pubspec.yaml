name: member_app
description: Genesis Prestige Member Mobile App.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.0

  # Secure storage (via gp_api_client, re-exported for app-level use)
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^13.0.0

  # Shared packages
  gp_api_client:
    path: ../gp_api_client
  gp_ui:
    path: ../gp_ui

  # Offline cache
  hive_flutter: ^1.1.0

  # Biometric authentication
  local_auth: ^2.2.0

  # State management (codegen annotations)
  riverpod_annotation: ^2.3.0

  # Utilities
  uuid: ^4.4.0

dev_dependencies:
  build_runner: ^2.4.0
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.4.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
