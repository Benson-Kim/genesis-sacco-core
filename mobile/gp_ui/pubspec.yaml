name: gp_ui
description: Genesis Prestige shared UI package — design tokens and widgets.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
  # Real fonts and device frames for the component sheet goldens. Without it
  # every glyph renders as a filled box and the sheet is unreviewable.
  gp_golden:
    path: ../gp_golden

flutter:
  # No assets at scaffold stage; add fonts/images in P17/P18.
