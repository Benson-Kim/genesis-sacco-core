# =============================================================================
# Genesis Prestige — GitHub Actions mirror of the mobile jobs in .gitlab-ci.yml
# (the single source of truth — see README "CI parity"). Job-for-job:
#   mobile:analyze -> mobile:test        (needs chain, Flutter stable)
#   mobile:codegen-drift                 (independent, regenerate + diff)
#
# The guard sweeps are NOT reimplemented here. Both pipelines run the same
# mobile/scripts/guard_sweeps.sh, because a gate that is written twice is a
# gate that will eventually mean two different things.
#
# GitLab `rules:exists` on mobile/**/pubspec.yaml translates to a paths filter
# plus a guard step, so the workflow is a no-op on branches without mobile/.
# =============================================================================
name: mobile

on:
  push:
    branches: [main, develop]
    tags: ['**']
  pull_request:

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Mirrors GitLab `mobile:analyze`.
  # ---------------------------------------------------------------------------
  mobile-analyze:
    name: "mobile:analyze"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip when the workspace is absent
        id: guard
        run: |
          if ls mobile/*/pubspec.yaml >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.guard.outputs.present == 'true'
        with:
          # PINNED, not `channel: stable`. dart format's output is version
          # dependent -- the tall style landed in a Dart release and rewraps
          # almost every file -- so a byte-exact gate on a floating channel
          # means a branch that was green can go red with no commit behind
          # it. Bumping this is a deliberate commit that carries its own
          # reformatting, reviewed like any other change.
          flutter-version: 3.47.1

      # Resolution is its OWN step, and everything below depends on it having
      # happened. `dart format` reads .dart_tool/package_config.json to learn
      # a package's language version; without it, it assumes the newest
      # language version and switches to the tall style, reformatting
      # perfectly good files. Resolving inside the analyze loop meant one
      # package's analyzer complaint aborted the loop under `bash -e`, left
      # later packages unresolved, and turned a one-line analyzer info into a
      # two-thousand-line phantom formatting diff.
      - name: Resolve every package
        if: steps.guard.outputs.present == 'true'
        run: |
          for package in mobile/*/; do
            if [ -f "${package}pubspec.yaml" ]; then
              (cd "$package" && flutter pub get)
            fi
          done

      - name: Analyze every package
        if: always() && steps.guard.outputs.present == 'true'
        run: |
          failures=0
          for package in mobile/*/; do
            if [ -f "${package}pubspec.yaml" ]; then
              (cd "$package" && flutter analyze) || failures=$((failures + 1))
            fi
          done
          if [ "$failures" -gt 0 ]; then
            echo "${failures} package(s) failed analysis." >&2
            exit 1
          fi

      # lib/src/generated/ is EXCLUDED: dart format rewraps long lines with an
      # algorithm the generator cannot reproduce, so the two gates would fight
      # forever -- format rewraps, codegen-drift reverts. The generated tree is
      # governed by mobile:codegen-drift instead, which rejects ANY change to
      # it, formatting included. Same split as **/*.g.dart in analysis_options.
      #
      # On failure, PRINT THE PATCH. A bare "7 files changed" tells a
      # contributor without a local Dart SDK nothing they can act on; the
      # unified diff applies verbatim. Same reasoning as the web client-drift
      # job, which prints its own diff rather than just failing.
      # `always()`: these three gates are INDEPENDENT of each other, and a
      # gate that hides the next one costs a whole pipeline per finding. The
      # analyzer failing tells you nothing about the formatter, so run both and
      # report both. Every finding in one run, not one finding per run.
      - name: Check formatting
        if: always() && steps.guard.outputs.present == 'true'
        run: |
          mapfile -t DART_FILES < <(find mobile -name '*.dart' -not -path '*/generated/*')
          if ! dart format --output=none --set-exit-if-changed "${DART_FILES[@]}"; then
            echo "::group::Formatting patch (apply with: git apply)"
            dart format "${DART_FILES[@]}" >/dev/null
            git --no-pager diff -- mobile/
            echo "::endgroup::"
            exit 1
          fi

      - name: Guard sweeps (money math, staff paths, tokens in logs, imports)
        if: always() && steps.guard.outputs.present == 'true'
        run: bash mobile/scripts/guard_sweeps.sh

  # ---------------------------------------------------------------------------
  # Mirrors GitLab `mobile:test`.
  # ---------------------------------------------------------------------------
  mobile-test:
    name: "mobile:test"
    runs-on: ubuntu-latest
    needs: [mobile-analyze]
    steps:
      - uses: actions/checkout@v4

      - name: Skip when the workspace is absent
        id: guard
        run: |
          if ls mobile/*/pubspec.yaml >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.guard.outputs.present == 'true'
        with:
          # PINNED, not `channel: stable`. dart format's output is version
          # dependent -- the tall style landed in a Dart release and rewraps
          # almost every file -- so a byte-exact gate on a floating channel
          # means a branch that was green can go red with no commit behind
          # it. Bumping this is a deliberate commit that carries its own
          # reformatting, reviewed like any other change.
          flutter-version: 3.47.1

      # Golden tests are EXCLUDED here and run in mobile:goldens instead.
      # They are a design review artifact before they are a regression gate:
      # they need real fonts loaded from the SDK, they write PNGs, and their
      # images have to be published somewhere a person can look at them.
      # Mixing that into the unit run would slow every push for a benefit
      # nobody reads on every push.
      - name: Run every package's tests
        if: steps.guard.outputs.present == 'true'
        run: |
          for package in mobile/*/; do
            if [ -f "${package}pubspec.yaml" ] && [ -d "${package}test" ]; then
              (cd "$package" && flutter pub get \
                && flutter test --exclude-tags golden)
            fi
          done

  # ---------------------------------------------------------------------------
  # Mirrors GitLab `mobile:goldens`. Renders every screen and component state
  # to a PNG and publishes them as a workflow artifact.
  #
  # This is how the design gets reviewed. There is no local Flutter SDK on the
  # authoring machine, so CI is the only thing in this project that can draw a
  # pixel; a job that renders and publishes is the difference between a design
  # somebody can approve and a pile of Dart nobody can picture.
  #
  # `--update-goldens` WRITES the images rather than comparing them, which is
  # correct while the design is still being agreed. Once it is signed off the
  # images get committed and this flips to a comparison, at which point it
  # also becomes the regression gate that stops an unintended visual change.
  # ---------------------------------------------------------------------------
  mobile-goldens:
    name: "mobile:goldens"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip when the workspace is absent
        id: guard
        run: |
          if ls mobile/*/pubspec.yaml >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.guard.outputs.present == 'true'
        with:
          # PINNED, not `channel: stable`. dart format's output is version
          # dependent -- the tall style landed in a Dart release and rewraps
          # almost every file -- so a byte-exact gate on a floating channel
          # means a branch that was green can go red with no commit behind
          # it. Bumping this is a deliberate commit that carries its own
          # reformatting, reviewed like any other change.
          flutter-version: 3.47.1

      - name: Render goldens
        if: steps.guard.outputs.present == 'true'
        run: |
          for package in mobile/*/; do
            # `test/golden/` by convention, not `test/`: `flutter test --tags
            # golden` exits 79 when a package has tests but none tagged, and
            # that is a normal state for gp_api_client rather than a failure.
            if [ -d "${package}test/golden" ]; then
              (cd "$package" && flutter pub get \
                && flutter test --tags golden --update-goldens)
            fi
          done

      - name: Collect the images
        if: always() && steps.guard.outputs.present == 'true'
        run: |
          mkdir -p golden-output
          find mobile -path '*/test/golden/images/*.png' -print0 \
            | while IFS= read -r -d '' image; do
                package="$(echo "$image" | cut -d/ -f2)"
                cp "$image" "golden-output/${package}__$(basename "$image")"
              done
          ls -la golden-output || true

      # `always()`: when a golden test FAILS the comparison, Flutter writes
      # the expected, actual and diff images into test/failures/. Those are
      # the most useful artifacts in the whole job and they only exist on the
      # run that failed, so publishing them only on success would throw away
      # the evidence exactly when it is needed.
      - name: Publish
        if: always() && steps.guard.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-goldens
          path: |
            golden-output/
            mobile/*/test/golden/images/failures/
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Mirrors GitLab `mobile:codegen-drift`. Regenerates the member models from
  # the committed OpenAPI snapshot and fails on any diff — a hand-edited or
  # stale generated file is a red pipeline.
  # ---------------------------------------------------------------------------
  mobile-codegen-drift:
    name: "mobile:codegen-drift"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip when the generator config is absent
        id: guard
        run: |
          if [ -f mobile/scripts/generate_api_models.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.present == 'true'
        with:
          python-version: '3.12'

      - name: Generator guards
        if: steps.guard.outputs.present == 'true'
        working-directory: mobile/scripts
        run: python test_generate_api_models.py

      - name: Regenerate and diff
        if: steps.guard.outputs.present == 'true'
        run: python mobile/scripts/generate_api_models.py --check
