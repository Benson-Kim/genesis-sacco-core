# =============================================================================
# Genesis Prestige — GitHub Actions mirror of the mobile jobs in .gitlab-ci.yml
# (the single source of truth — see README "CI parity"). Job-for-job:
#   mobile:analyze -> mobile:test        (needs chain, Flutter stable)
#   mobile:codegen-drift                 (independent, regenerate + diff)
#
# The guard sweeps are NOT reimplemented here. Both pipelines run the same
# mobile/scripts/guard_sweeps.sh, because a gate that is written twice is a
# gate that will eventually mean two different things.
#
# GitLab `rules:exists` on mobile/**/pubspec.yaml translates to a paths filter
# plus a guard step, so the workflow is a no-op on branches without mobile/.
# =============================================================================
name: mobile

on:
  push:
    branches: [main, develop]
    tags: ['**']
  pull_request:

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Mirrors GitLab `mobile:analyze`.
  # ---------------------------------------------------------------------------
  mobile-analyze:
    name: "mobile:analyze"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip when the workspace is absent
        id: guard
        run: |
          if ls mobile/*/pubspec.yaml >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.guard.outputs.present == 'true'
        with:
          channel: stable

      - name: Analyze every package
        if: steps.guard.outputs.present == 'true'
        run: |
          for package in mobile/*/; do
            if [ -f "${package}pubspec.yaml" ]; then
              (cd "$package" && flutter pub get && flutter analyze)
            fi
          done

      # lib/src/generated/ is EXCLUDED: dart format rewraps long lines with an
      # algorithm the generator cannot reproduce, so the two gates would fight
      # forever -- format rewraps, codegen-drift reverts. The generated tree is
      # governed by mobile:codegen-drift instead, which rejects ANY change to
      # it, formatting included. Same split as **/*.g.dart in analysis_options.
      #
      # On failure, PRINT THE PATCH. A bare "7 files changed" tells a
      # contributor without a local Dart SDK nothing they can act on; the
      # unified diff applies verbatim. Same reasoning as the web client-drift
      # job, which prints its own diff rather than just failing.
      # `always()`: these three gates are INDEPENDENT of each other, and a
      # gate that hides the next one costs a whole pipeline per finding. The
      # analyzer failing tells you nothing about the formatter, so run both and
      # report both. Every finding in one run, not one finding per run.
      - name: Check formatting
        if: always() && steps.guard.outputs.present == 'true'
        run: |
          mapfile -t DART_FILES < <(find mobile -name '*.dart' -not -path '*/generated/*')
          if ! dart format --output=none --set-exit-if-changed "${DART_FILES[@]}"; then
            echo "::group::Formatting patch (apply with: git apply)"
            dart format "${DART_FILES[@]}" >/dev/null
            git --no-pager diff -- mobile/
            echo "::endgroup::"
            exit 1
          fi

      - name: Guard sweeps (money math, staff paths, tokens in logs, imports)
        if: always() && steps.guard.outputs.present == 'true'
        run: bash mobile/scripts/guard_sweeps.sh

  # ---------------------------------------------------------------------------
  # Mirrors GitLab `mobile:test`.
  # ---------------------------------------------------------------------------
  mobile-test:
    name: "mobile:test"
    runs-on: ubuntu-latest
    needs: [mobile-analyze]
    steps:
      - uses: actions/checkout@v4

      - name: Skip when the workspace is absent
        id: guard
        run: |
          if ls mobile/*/pubspec.yaml >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.guard.outputs.present == 'true'
        with:
          channel: stable

      - name: Run every package's tests
        if: steps.guard.outputs.present == 'true'
        run: |
          for package in mobile/*/; do
            if [ -f "${package}pubspec.yaml" ] && [ -d "${package}test" ]; then
              (cd "$package" && flutter pub get && flutter test)
            fi
          done

  # ---------------------------------------------------------------------------
  # Mirrors GitLab `mobile:codegen-drift`. Regenerates the member models from
  # the committed OpenAPI snapshot and fails on any diff — a hand-edited or
  # stale generated file is a red pipeline.
  # ---------------------------------------------------------------------------
  mobile-codegen-drift:
    name: "mobile:codegen-drift"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip when the generator config is absent
        id: guard
        run: |
          if [ -f mobile/scripts/generate_api_models.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.present == 'true'
        with:
          python-version: '3.12'

      - name: Generator guards
        if: steps.guard.outputs.present == 'true'
        working-directory: mobile/scripts
        run: python test_generate_api_models.py

      - name: Regenerate and diff
        if: steps.guard.outputs.present == 'true'
        run: python mobile/scripts/generate_api_models.py --check
