[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-backend"
version = "0.1.0"
description = "Genesis Prestige SACCO platform backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "hypothesis>=6.100",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "BLE", "S", "T20", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.importlinter]
root_package = "genesis"

[[tool.importlinter.contracts]]
name = "Domain layer is pure (MASTER_PROMPT 2.1)"
type = "forbidden"
source_modules = ["genesis.domain"]
forbidden_modules = ["genesis.api", "genesis.application", "genesis.infrastructure"]

[[tool.importlinter.contracts]]
name = "Application layer independent of delivery and adapters"
type = "forbidden"
source_modules = ["genesis.application"]
forbidden_modules = ["genesis.api", "genesis.infrastructure"]

[[tool.importlinter.contracts]]
name = "Request handlers never call providers directly (MASTER_PROMPT 1.2)"
type = "forbidden"
source_modules = ["genesis.api"]
forbidden_modules = [
    "genesis.infrastructure.providers",
    "genesis.infrastructure.outbox_worker",
    "genesis.infrastructure.export_worker",
    "genesis.infrastructure.idempotency_worker",
]
